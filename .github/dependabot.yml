version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (pins are
  # enforced by tests/test_actions_pinned.py). Minor and patch updates arrive
  # as one grouped PR per week; major versions come as separate PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(ci)"

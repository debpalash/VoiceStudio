name: Electron packaging rehearsal

# Explicitly artifact-only: no tag, schedule, release, or publishing permission.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            flags: --linux --x64
            local_runtime: true
          - runner: windows-2022
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            flags: --win --x64
            local_runtime: true
          - runner: windows-11-arm
            platform: win32
            arch: arm64
            target: aarch64-pc-windows-msvc
            flags: --win --arm64
            local_runtime: true
            # New target: report failures without hiding the other legs.
            experimental: true
          - runner: macos-15
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
            flags: --mac --arm64
            local_runtime: true
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
            flags: --mac --x64
            # PyTorch no longer ships the required macOS Intel wheels.
            local_runtime: false
    defaults:
      run:
        shell: bash
    env:
      VOICESTUDIO_RUST_TARGET: ${{ matrix.target }}
      # Rehearsal artifacts carry the stable feed; there is no preview release.
      VOICESTUDIO_UPDATE_CHANNEL: electron-stable-${{ matrix.platform }}-${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/desktop-bridge -> target
          key: electron-${{ matrix.target }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxdo-dev libxtst-dev libx11-dev libxkbcommon-dev libwayland-dev libssl-dev pkg-config xvfb zsync
      - name: Bundle pinned uv for the host architecture
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, copyFileSync, chmodSync } from 'node:fs';
          import { join } from 'node:path';
          const expected = process.env.VOICESTUDIO_RUST_TARGET;
          const targets = { 'linux-x64': 'x86_64-unknown-linux-gnu', 'win32-x64': 'x86_64-pc-windows-msvc', 'win32-arm64': 'aarch64-pc-windows-msvc', 'darwin-arm64': 'aarch64-apple-darwin', 'darwin-x64': 'x86_64-apple-darwin' };
          if (targets[`${process.platform}-${process.arch}`] !== expected) throw new Error('Runner architecture does not match package target');
          const source = execFileSync(process.platform === 'win32' ? 'where.exe' : 'which', ['uv'], { encoding: 'utf8' }).trim().split(/\r?\n/)[0];
          const dir = 'electron/build/uv';
          mkdirSync(dir, { recursive: true });
          const destination = join(dir, `uv-${expected}${process.platform === 'win32' ? '.exe' : ''}`);
          copyFileSync(source, destination);
          if (process.platform !== 'win32') chmodSync(destination, 0o755);
          NODE
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate and build Electron
        run: bun run check:electron
      - name: Package without publishing
        working-directory: electron
        run: |
          bun x electron-builder --config electron-builder.config.mjs ${{ matrix.flags }} --publish never
          if [ "$RUNNER_OS" = Linux ]; then
            node scripts/embed-appimage-update.mjs
          fi
          node tests/packaging-contract.mjs --artifact
          node tests/update-package-contract.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Packaged startup smoke test
        working-directory: electron
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            for image in release/VoiceStudio-Electron-*-linux-x64.AppImage; do
              VOICESTUDIO_PACKAGED_EXE="electron/$image" xvfb-run -a node tests/packaged-smoke.mjs --setup
            done
          else
            node tests/packaged-smoke.mjs --setup
          fi
      - name: Install and start a fresh packaged runtime
        if: matrix.local_runtime
        working-directory: electron
        timeout-minutes: 25
        env:
          VOICESTUDIO_RUNTIME_TIMEOUT_MS: '1200000'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node tests/packaged-smoke.mjs --install
          else
            node tests/packaged-smoke.mjs --install
          fi
      - name: Save installers and updater metadata for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-rehearsal-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            electron/release/VoiceStudio-Electron-*
            electron/release/electron-*.yml

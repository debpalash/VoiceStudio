# Build the `omnivoice-tts` C++ runtime binary (Phase 4 Plan 04-01, GGUF-03).
#
# The runtime is PINNED to a commit SHA in
# `backend/engines/omnivoice_gguf/quant_map.json` (`_meta.runtime_commit_sha`),
# so the binary only changes when that pin (or the build script) changes — NOT
# on every PR. This workflow is therefore gated to those paths + manual
# dispatch, instead of running on every push.
#
# Why it moved off ci.yml: the per-push matrix kept the heavily-contended
# hosted macOS runners (especially the Intel `macos-13` pool) sitting in
# "Waiting for a runner…" for hours as a perpetual queued check. The engine's
# runtime gracefully reports unavailable on a missing binary (falls back to the
# in-process OmniVoiceBackend), so this build is not on the critical PR path.
#
# No `darwin-x86_64` leg: Intel Macs cannot run the local Python backend at
# all (docs/install/macos.md), so a binary for them would never be spawned.
#
# electron-release.yml and electron-build.yml call this workflow
# (`workflow_call`, `desktop: true`) and package each leg's artifact into the
# installer under `resources/bin/` (#2780). One build definition serves the
# standalone check and every installer.
name: Build omnivoice-tts

on:
  pull_request:
    branches: [main]
    paths:
      - backend/engines/omnivoice_gguf/quant_map.json
      - scripts/build-omnivoice-tts.sh
      - scripts/lib/omnivoice-vulkan.sh
      - .github/workflows/build-omnivoice-tts.yml
  push:
    branches: [main]
    paths:
      - backend/engines/omnivoice_gguf/quant_map.json
      - scripts/build-omnivoice-tts.sh
      - scripts/lib/omnivoice-vulkan.sh
      - .github/workflows/build-omnivoice-tts.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the calling run's ref)"
        type: string
        default: ''
      desktop:
        description: "Build only the platforms the desktop installers ship"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-omnivoice-tts:
    name: Build omnivoice-tts (${{ matrix.platform }})
    # Runner per platform. A lookup (not `include` entries) so `exclude` can
    # drop a platform: an `include` that matches no combination re-adds one.
    runs-on: ${{ fromJSON('{"linux-x86_64":"ubuntu-latest","linux-aarch64":"ubuntu-24.04-arm","windows-x86_64":"windows-latest","darwin-arm64":"macos-15"}')[matrix.platform] }}
    # linux-aarch64 (Apple Silicon under Asahi Linux) is experimental: the
    # Vulkan (Honeykrisp GPU) build path is new and the hosted arm64 runner has
    # no GPU — it validates that the binary builds; on-host Vulkan acceleration
    # is exercised by users. darwin-arm64 compiles cleanly with
    # -DGGML_METAL=ON at the pinned SHA (#2105) and is not experimental.
    continue-on-error: ${{ matrix.platform == 'linux-aarch64' }}
    # Bound worst-case cost: a hung leg (esp. the experimental darwin-arm64
    # Metal build) shouldn't run to GitHub's 6h ceiling burning runner minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch64, windows-x86_64, darwin-arm64]
        # The installers ship no Linux ARM64 build, so desktop calls skip it.
        exclude:
          - platform: ${{ inputs.desktop && 'linux-aarch64' || 'none' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read pinned omnivoice.cpp SHA from quant_map.json
        id: pin
        shell: bash
        run: |
          sha=$(python -c "import json; print(json.load(open('backend/engines/omnivoice_gguf/quant_map.json'))['_meta']['runtime_commit_sha'])")
          # Validate it's a git SHA before it ever reaches a shell command —
          # a crafted quant_map.json value must not be able to inject shell.
          if ! [[ "$sha" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::runtime_commit_sha is not a valid git SHA: '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Linux: let the build script's Vulkan path engage instead of silently
      # falling back to CPU — the installers' AMD/Intel GPU path on x64, and
      # the Honeykrisp GPU on Asahi (aarch64). The module is loaded at runtime
      # (GGML_BACKEND_DL), so a host without a Vulkan driver still starts on CPU.
      - name: Vulkan dev deps (Linux GPU backend)
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev spirv-headers

      # Windows: the LunarG SDK provides glslc and the headers; the build script
      # detects it through VULKAN_SDK. A failed SDK install degrades to the CPU
      # build (the check below then warns) rather than failing the release.
      - name: Vulkan SDK (Windows GPU backend)
        if: matrix.platform == 'windows-x86_64'
        continue-on-error: true
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.309.0
          cache: true

      - name: Build omnivoice-tts
        shell: bash
        # Pass values through env (quoted) rather than ${{ }} interpolation
        # directly into the run block — avoids shell-injection on the inputs.
        env:
          PIN_SHA: ${{ steps.pin.outputs.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          bash scripts/build-omnivoice-tts.sh \
            --platform "$PLATFORM" \
            --commit-sha "$PIN_SHA"
      # The installers' AMD/Intel GPU acceleration is the optional ggml-vulkan
      # module beside the binary. Linux x64 must ship it (its deps come from
      # apt above); a Windows leg without it only warns, since its SDK step is
      # allowed to fail.
      - name: Check the Vulkan GPU module was built
        if: matrix.platform == 'linux-x86_64' || matrix.platform == 'windows-x86_64'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if ls bin/ | grep -q 'ggml-vulkan'; then
            echo "Vulkan module: $(ls bin/ | grep 'ggml-vulkan')"
          elif [ "$PLATFORM" = linux-x86_64 ]; then
            echo "::error::linux-x86_64 built without the ggml-vulkan module"; exit 1
          else
            echo "::warning::$PLATFORM built without the ggml-vulkan module (CPU-only runtime)"
          fi
      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omnivoice-tts-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            bin/omnivoice-tts-${{ matrix.platform }}*
            bin/libggml*
            bin/ggml*.dll
            bin/vcruntime140*.dll
            bin/msvcp140*.dll
            bin/vcomp140.dll
            bin/checksums.sha256

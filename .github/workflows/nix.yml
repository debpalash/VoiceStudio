name: Nix flake

# The community flake (flake.nix, docs/install/nix.md) is not part of the
# required gate, but it must still evaluate and build: fixed-output hashes,
# nixpkgs attribute names and the packaged resource contract drift silently
# otherwise. Broad path filters exclude unrelated inputs; the shared CI scope
# detector handles docs/test-only changes, including inline tests, on every event.

on:
  pull_request:
    paths:
      # The package is built from the whole checkout (electron/src, backend,
      # omnivoice, scripts, config, lockfiles), and its checks exist to catch
      # source changes such as a new main-process import missing from the
      # prune roots. So run on everything except what cannot reach the build.
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!mobile/**'
      - '!tests/**'
      - '!backend/tests/**'
      - '!changelog.d/**'
      - '!.github/**'
      - 'docs/install/nix.md'
      - 'docs/logo.svg'
      - 'docs/logo.png'
      - 'docs/licensing/model-license-data.json'
      - '.github/workflows/nix.yml'
  push:
    branches: [main]
    paths:
      # Same scope as pull_request.
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!mobile/**'
      - '!tests/**'
      - '!backend/tests/**'
      - '!changelog.d/**'
      - '!.github/**'
      - 'docs/install/nix.md'
      - 'docs/logo.svg'
      - 'docs/logo.png'
      - 'docs/licensing/model-license-data.json'
      - '.github/workflows/nix.yml'
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nix-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake:
    name: Evaluate and build the flake
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same hold as the other pull-request workflows: wait while the opener has
      # not signed the CLA. The CLA check re-runs this run once they sign.
      - name: Hold while the CLA is unsigned
        id: cla
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_scope.py --cla

      - name: Detect changes that need the flake build
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          CLA_HOLD: ${{ steps.cla.outputs.cla }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CLA_HOLD" = held ]; then
            echo "CLA not signed yet: skipping. Signing re-runs this check."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import subprocess
          import sys

          sys.path.insert(0, ".github/scripts")
          import ci_scope


          def outside_package(file: object) -> bool:
              # Merge queues ignore workflow path filters. Retain only Nix's own
              # mobile/.github exclusions; docs/test classification stays shared.
              if not isinstance(file, dict) or file.get("status") not in {"added", "modified", "removed", "renamed"}:
                  return False
              paths = [file.get("filename")]
              if file["status"] == "renamed":
                  paths.append(file.get("previous_filename"))
              return all(isinstance(path, str) and path and not PurePosixPath(path).is_absolute()
                         and not any(part in {".", ".."} for part in path.split("/"))
                         and path.startswith(("mobile/", ".github/"))
                         and path != ".github/workflows/nix.yml" for path in paths)


          needed = True
          try:
              event_name = os.environ["GITHUB_EVENT_NAME"]
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              repo = os.environ["GITHUB_REPOSITORY"]
              needed = ci_scope.detect(event_name, event, repo)
              if needed and event_name == "merge_group":
                  base, head = (event["merge_group"][key] for key in ("base_sha", "head_sha"))
                  if all(isinstance(sha, str) and re.fullmatch(r"[0-9a-f]{40}", sha) and sha != "0" * 40 for sha in (base, head)):
                      response = subprocess.run(["gh", "api", f"repos/{repo}/compare/{base}...{head}", "--jq", ".files"],
                                                check=True, capture_output=True, text=True)
                      files = json.loads(response.stdout)
                      # Empty, truncated or malformed evidence must never become a skip.
                      if isinstance(files, list) and 0 < len(files) < 300:
                          remaining = [file for file in files if not outside_package(file)]
                          needed = bool(remaining) and ci_scope.runtime_needed(remaining, 300)
          except (OSError, ValueError, KeyError, TypeError, subprocess.SubprocessError):
              needed = True
              print("Nix change detection unavailable; running the full build.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={str(needed).lower()}\n")
          print("Flake inputs changed; building." if needed else "Only documentation/tests or excluded package inputs changed; skipping the flake build.")
          PY

      - name: Free runner disk space
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/boost /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        if: steps.scope.outputs.run == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate every system
        if: steps.scope.outputs.run == 'true'
        run: nix flake check --all-systems --no-build

      - name: Build the Linux app
        if: steps.scope.outputs.run == 'true'
        run: nix build .#default -L

      - name: Run the flake checks
        if: steps.scope.outputs.run == 'true'
        run: nix flake check -L

      - name: Enter the development shell
        if: steps.scope.outputs.run == 'true'
        run: |
          nix develop --command sh -c \
            'test -x "$ELECTRON_OVERRIDE_DIST_PATH/electron" && bun --version && uv --version'

      - name: Enter the FHS environment
        if: steps.scope.outputs.run == 'true'
        run: |
          # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          nix run .#fhs -- -c 'test -e /lib64/ld-linux-x86-64.so.2 && uv --version'
          timeout 600 nix develop .#fhs --command true < /dev/null

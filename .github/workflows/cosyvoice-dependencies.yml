name: CosyVoice dependency smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/services/sidecar_install.py'
      - 'backend/engines/cosyvoice_subprocess/**'
      - 'scripts/smoke-cosyvoice-dependencies.py'
      - '.github/workflows/cosyvoice-dependencies.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-dependencies:
    name: CosyVoice dependencies (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - name: Build and import Python 3.10 dependencies
        shell: bash
        run: |
          uv venv --python 3.10 .cosyvoice-probe
          probe_python=.cosyvoice-probe/bin/python
          if [[ "$RUNNER_OS" == Windows ]]; then probe_python=.cosyvoice-probe/Scripts/python.exe; fi
          uv pip install --python "$probe_python" \
            'pyworld @ git+https://github.com/JeremyCCHsu/Python-Wrapper-for-World-Vocoder.git@f31ad88d543fdaebbda2d0c9a5e4d4f991ae0b6c' \
            numpy==1.26.4 setuptools==84.0.0 \
            gdown==6.4.0 wget==3.2 pyarrow==25.0.1
          "$probe_python" scripts/smoke-cosyvoice-dependencies.py

# Exercise the maintained Electron installers, never the archived Tauri build.
name: Install smoke
on:
  pull_request:
    paths: ['scripts/install.sh', 'scripts/install.ps1', 'electron/tests/*installer*', '.github/workflows/install-smoke.yml']
  push:
    branches: [main]
    paths: ['scripts/install.sh', 'scripts/install.ps1', 'electron/tests/*installer*', '.github/workflows/install-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  changes:
    name: Changed runtime paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_scope.py

  install:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.runtime != 'false' }}
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Main builds package the terminal command, which uv builds.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          helper=.github/scripts/apt-retry.sh
          # An older release tag predates the helper; take it from this workflow's commit.
          if [ ! -f "$helper" ]; then
            helper="$RUNNER_TEMP/apt-retry.sh"
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$GITHUB_REPOSITORY/contents/.github/scripts/apt-retry.sh?ref=$GITHUB_SHA" > "$helper"
          fi
          bash "$helper" install build-essential pkg-config libasound2-dev libxdo-dev libxtst-dev libx11-dev libxkbcommon-dev libwayland-dev libssl-dev binutils zsync
      - name: Native PowerShell safety cases
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./electron/tests/powershell-installer.ps1
      - name: Shell safety cases
        if: runner.os != 'Windows'
        working-directory: electron
        run: node --test tests/shell-installer.test.mjs tests/installer-worker.test.mjs
      - name: Install latest release (macOS/Linux)
        if: runner.os != 'Windows'
        run: sh scripts/install.sh
      - name: Build and install main (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Exercise the PR source as main before its installer changes are merged.
            git init --bare -q --initial-branch=main "$RUNNER_TEMP/voicestudio-main.git"
            git --git-dir "$RUNNER_TEMP/voicestudio-main.git" config receive.shallowUpdate true
            git push "$RUNNER_TEMP/voicestudio-main.git" HEAD:refs/heads/main
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="url.file://$RUNNER_TEMP/voicestudio-main.git.insteadOf"
            export GIT_CONFIG_VALUE_0=https://github.com/debpalash/VoiceStudio.git
          fi
          sh scripts/install.sh --main
      - name: Verify and uninstall Electron (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "$(uname)" = Darwin ]; then
            test -f /Applications/VoiceStudio.app/Contents/Resources/app.asar
          else
            test -x "$HOME/.local/bin/VoiceStudio"
          fi
          sh scripts/install.sh --uninstall
          if [ "$(uname)" = Darwin ]; then
            test ! -e /Applications/VoiceStudio.app
          else
            test ! -e "$HOME/.local/bin/VoiceStudio"
          fi
      - name: Install latest release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1 -Silent
      - name: Verify and uninstall release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $keys = @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')
          $entry = Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match '^VoiceStudio(?: \d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?)?$' -and $_.UninstallString -match 'Uninstall VoiceStudio.exe' } | Select-Object -First 1
          if (-not $entry) { throw 'Electron NSIS product not registered' }
          & ./scripts/install.ps1 -Uninstall -Silent
          if (Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match '^VoiceStudio(?: \d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?)?$' -and $_.UninstallString -match 'Uninstall VoiceStudio.exe' }) { throw 'Electron remains registered after uninstall' }
      - name: Build and install main (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            # Exercise the PR source as main before its installer changes are merged.
            $bare = Join-Path $env:RUNNER_TEMP 'voicestudio-main.git'
            git init --bare -q --initial-branch=main $bare
            git --git-dir $bare config receive.shallowUpdate true
            git push $bare HEAD:refs/heads/main
            $env:GIT_CONFIG_COUNT = '1'
            $env:GIT_CONFIG_VALUE_0 = 'https://github.com/debpalash/VoiceStudio.git'
            $env:GIT_CONFIG_KEY_0 = "url.file:///$($bare.Replace('\', '/')).insteadOf"
          }
          ./scripts/install.ps1 -Main -Silent
      - name: Verify and uninstall Electron (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $keys = @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')
          $entry = Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match '^VoiceStudio(?: \d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?)?$' -and $_.UninstallString -match 'Uninstall VoiceStudio.exe' } | Select-Object -First 1
          if (-not $entry) { throw 'Electron NSIS product not registered' }
          & ./scripts/install.ps1 -Uninstall -Silent
          if (Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match '^VoiceStudio(?: \d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?)?$' -and $_.UninstallString -match 'Uninstall VoiceStudio.exe' }) { throw 'Electron remains registered after uninstall' }

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc">
<title id="title">Proposed VoiceStudio installation experience</title>
<desc id="desc">Three illustrative screens: review a target-bound installation plan, follow persistent download progress, and recover from a failure while retaining completed downloads. This is a design mockup, not a screenshot of implemented software. All storage numbers are illustrative.</desc>

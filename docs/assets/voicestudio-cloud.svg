<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">VoiceStudio Cloud</title>
  <desc id="description">A cool blue speech waveform with a small cloud on a dark rounded tile.</desc>
  <defs>
    <linearGradient id="tile" x1="7" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161D2B"/>
      <stop offset="1" stop-color="#0E121B"/>
    </linearGradient>
    <radialGradient id="warmth" cx="0" cy="0" r="1" gradientTransform="translate(49 13) rotate(132) scale(42)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23416B" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#23416B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="voice" x1="7" y1="18" x2="59" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8EEFF"/>
      <stop offset="0.5" stop-color="#7FC4FF"/>
      <stop offset="1" stop-color="#8E9BFF"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="url(#warmth)" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <path d="M6 34c4 0 5-7 9-7 5 0 4 14 9 14 5 0 4-23 9-23s4 28 9 28 4-21 9-21c4 0 5 9 8 9" fill="none" stroke="url(#voice)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 22.5a4.6 4.6 0 0 1 1.1-9 6.2 6.2 0 0 1 11.6 1.5 3.8 3.8 0 0 1-.9 7.5Z" fill="#CFE8FF"/>

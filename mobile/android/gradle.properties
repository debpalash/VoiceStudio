org.gradle.jvmargs=-Xmx2g -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=false

kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2

org.gradle.vfs.watch=false

# Maven Central answers shared CI IPs with HTTP 429; allow six attempts with a
# doubling backoff from 2s (five waits, 62s in total). Gradle 8.13 reads
# max.tentatives; it ignores a max.retries key.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000

name: VoiceStudio
options:
  bundleIdPrefix: sh.voicestudio
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  preGenCommand: python3 ../scripts/prepare_resources.py --output ../.generated/bundle --info-output ../.generated/Info.plist
packages:
  VoiceStudioKit:
    path: ../VoiceStudioKit
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    VS_APP_GROUP_IDENTIFIER: group.sh.voicestudio.mobile.development
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
targets:
  VoiceStudio:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: Platform
      - path: Resources
      - path: ../.generated/Brand.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.voicestudio.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: VoiceStudio.entitlements
        GENERATE_INFOPLIST_FILE: 'NO'
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/VoiceStudio-Info.plist
    dependencies:
      - target: VoiceStudioShare
      - target: VoiceStudioWidget
      - package: VoiceStudioKit
      - framework: ../../native/ios/build/xcframeworks/sherpa-onnx.xcframework
        embed: false
      - framework: ../../native/ios/build/xcframeworks/onnxruntime.xcframework
        embed: false
      - framework: ../../native/ios/build/xcframeworks/llama.xcframework
        embed: true
      - framework: ../../native/ios/build/xcframeworks/OmniVoice.xcframework
        embed: true
      - sdk: libc++.tbd
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    preBuildScripts:
      - name: Bundle catalogs and derive version
        script: |
          set -eu
          python3 "$SRCROOT/../scripts/prepare_resources.py" --output "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" --info-output "$DERIVED_FILE_DIR/VoiceStudio-Info.plist"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../../../package.json
          - $(SRCROOT)/Info.plist
          - $(SRCROOT)/../../../docs/logo.png
          - $(SRCROOT)/../../contract/tokens.json
          - $(SRCROOT)/../scripts/generate-brand-assets.swift
        outputFiles:
          - $(DERIVED_FILE_DIR)/VoiceStudio-Info.plist
          - $(SRCROOT)/../.generated/Brand.xcassets
  VoiceStudioShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ../VoiceStudioShare
        excludes: [Info.plist, VoiceStudioShare.entitlements]
    configFiles:
      Debug: ../.generated/Version.xcconfig
      Release: ../.generated/Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.voicestudio.mobile.development.share
        INFOPLIST_FILE: ../VoiceStudioShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../VoiceStudioShare/VoiceStudioShare.entitlements
        SKIP_INSTALL: 'YES'
        MARKETING_VERSION: $(VS_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(VS_BUILD_NUMBER)
  VoiceStudioWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ../VoiceStudioWidget
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.voicestudio.mobile.widget
        INFOPLIST_FILE: ../VoiceStudioWidget/Info.plist
        SKIP_INSTALL: 'YES'
        MARKETING_VERSION: $(VS_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(VS_BUILD_NUMBER)
    configFiles:
      Debug: ../.generated/Version.xcconfig
      Release: ../.generated/Version.xcconfig
    preBuildScripts:
      - name: Localize workspace widget
        script: python3 "$SRCROOT/../scripts/prepare_workspace_resources.py" --output "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
        basedOnDependencyAnalysis: false
  VoiceStudioKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../VoiceStudioKit/Tests/VoiceStudioKitTests
    dependencies:
      - target: VoiceStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/../VoiceStudioKit/Sources/VSNative/include/module.modulemap
  VoiceStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../VoiceStudioUITests
    dependencies:
      - target: VoiceStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
schemes:
  VoiceStudioNative:
    build:
      targets:
        VoiceStudio: all
    test:
      targets:
        - VoiceStudioKitTests
  VoiceStudio:
    build:
      targets:
        VoiceStudio: all
    test:
      targets:
        - VoiceStudioUITests
